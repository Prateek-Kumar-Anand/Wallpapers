plugins { id 'com.android.application' }

android {
    namespace 'com.example.motiongifwallpaper'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.motiongifwallpaper'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
